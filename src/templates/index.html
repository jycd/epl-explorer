<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPL Standings</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/home-page.css">
</head>
<body>

<div class="container">
    <div class="tabs">
        <a href="/" class="tab active">Standings</a>
        <a href="/team-history" class="tab">Team History</a>
        <a href="/average-stats" class="tab">Average Stats</a>
    </div>
    <h1 id="standingsTitle">EPL Season Standings</h1>

    <div id="standingsSection">
    <div class="controls">
        <label for="seasonSelect">Select Season:</label>
        <select id="seasonSelect">
            <option value="" disabled selected>Loading seasons...</option>
        </select>
        <button onclick="fetchStandings()">Get Standings</button>
        <label style="margin-left: 20px;">
            <input type="checkbox" id="includeRecent" onchange="saveRecentMatchesState(); fetchStandings()"> Show Recent Matches
        </label>
    </div>

    <div class="search-controls">
        <div class="search-box">
            <input type="text" id="teamSearch" class="search-input" placeholder="Search teams..." onkeyup="filterTeams()">
            <button onclick="clearSearch()">Clear</button>
        </div>
        <div class="filter-controls">
            <select id="positionFilter" onchange="filterTeams()">
                <option value="">All Positions</option>
                <option value="1-4">Champions League (1-4)</option>
                <option value="5">Europa League (5)</option>
                <option value="6-7">Conference League (6-7)</option>
                <option value="18-20">Relegation (18-20)</option>
            </select>
            <select id="formFilter" onchange="filterTeams()">
                <option value="">All Form</option>
                <option value="WWW">3+ Wins</option>
                <option value="DDD">3+ Draws</option>
                <option value="LLL">3+ Losses</option>
            </select>
        </div>
    </div>

    <div class="legend">
        <span class="legend-item"><span class="color-box" style="background-color: var(--ucl-bg);"></span> Champions League (1-4)</span>
        <span class="legend-item"><span class="color-box" style="background-color: var(--uel-bg);"></span> Europa League (5)</span>
        <span class="legend-item"><span class="color-box" style="background-color: var(--rel-bg);"></span> Relegation (Bottom 3)</span>
        <span class="cache-info" id="cacheInfo" style="margin-left: 20px; font-size: 12px; color: #666;">
            <span id="cacheStatus"></span>
            <button onclick="clearAllCache()" style="margin-left: 10px; padding: 2px 8px; font-size: 11px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">Clear Cache</button>
        </span>
    </div>

    <div id="filterResults" class="filter-results" style="display: none;"></div>

    <div id="error-message" class="error"></div>

    <table id="standingsTable" class="standings-table" style="display: none;">
        <thead>
            <tr>
                <th onclick="sortTable('position')">Pos <span id="sort-position" class="sort-icon"></span></th>
                <th onclick="sortTable('team')">Team <span id="sort-team" class="sort-icon"></span></th>
                <th onclick="sortTable('played')">Played <span id="sort-played" class="sort-icon"></span></th>
                <th onclick="sortTable('won')">Won <span id="sort-won" class="sort-icon"></span></th>
                <th onclick="sortTable('drawn')">Drawn <span id="sort-drawn" class="sort-icon"></span></th>
                <th onclick="sortTable('lost')">Lost <span id="sort-lost" class="sort-icon"></span></th>
                <th onclick="sortTable('goals_for')">GF <span id="sort-goals_for" class="sort-icon"></span></th>
                <th onclick="sortTable('goals_against')">GA <span id="sort-goals_against" class="sort-icon"></span></th>
                <th onclick="sortTable('goal_difference')">GD <span id="sort-goal_difference" class="sort-icon"></span></th>
                <th onclick="sortTable('points')">Points <span id="sort-points" class="sort-icon"></span></th>
                <th id="formHeader" style="display: none;">Form</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be inserted here -->
        </tbody>
    </table>
    </div>

</div>

<script>
    const API_BASE = '/api';
    let currentStandings = [];
    let sortDirection = {};

    // Frontend caching configuration
    const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes
    const CACHE_VERSION = '1.0'; // For cache invalidation

    function saveRecentMatchesState() {
        const includeRecentCheckbox = document.getElementById('includeRecent');
        localStorage.setItem('showRecentMatches', includeRecentCheckbox.checked);
        
        // Update URL to reflect recent matches state
        const url = new URL(window.location);
        if (includeRecentCheckbox.checked) {
            url.searchParams.set('recent', 'true');
        } else {
            url.searchParams.delete('recent');
        }
        window.history.replaceState({}, '', url);
    }

    // Frontend caching functions
    function getCacheKey(url) {
        return `cache_${CACHE_VERSION}_${url}`;
    }

    function getCachedData(url) {
        const cacheKey = getCacheKey(url);
        const cached = sessionStorage.getItem(cacheKey);
        const cachedTime = sessionStorage.getItem(`${cacheKey}_time`);
        
        if (cached && cachedTime && (Date.now() - parseInt(cachedTime) < CACHE_DURATION)) {
            try {
                return JSON.parse(cached);
            } catch (e) {
                console.warn('Invalid cached data, clearing:', cacheKey);
                sessionStorage.removeItem(cacheKey);
                sessionStorage.removeItem(`${cacheKey}_time`);
            }
        }
        return null;
    }

    function setCachedData(url, data) {
        const cacheKey = getCacheKey(url);
        try {
            sessionStorage.setItem(cacheKey, JSON.stringify(data));
            sessionStorage.setItem(`${cacheKey}_time`, Date.now().toString());
        } catch (e) {
            console.warn('Failed to cache data:', e);
            // Clear old cache if storage is full
            clearOldCache();
        }
    }

    function clearOldCache() {
        const keys = Object.keys(sessionStorage);
        const currentTime = Date.now();
        
        keys.forEach(key => {
            if (key.startsWith('cache_') && key.endsWith('_time')) {
                const cacheTime = parseInt(sessionStorage.getItem(key));
                if (currentTime - cacheTime > CACHE_DURATION) {
                    const dataKey = key.replace('_time', '');
                    sessionStorage.removeItem(dataKey);
                    sessionStorage.removeItem(key);
                }
            }
        });
    }

    function clearAllCache() {
        const keys = Object.keys(sessionStorage);
        keys.forEach(key => {
            if (key.startsWith('cache_')) {
                sessionStorage.removeItem(key);
            }
        });
        updateCacheStatus();
        console.log('All frontend cache cleared');
    }

    function updateCacheStatus() {
        const cacheKeys = Object.keys(sessionStorage).filter(key => key.startsWith('cache_') && !key.endsWith('_time'));
        const cacheCount = cacheKeys.length;
        const statusElement = document.getElementById('cacheStatus');
        
        if (cacheCount === 0) {
            statusElement.textContent = 'Cache: Empty';
            statusElement.style.color = '#999';
        } else {
            statusElement.textContent = `Cache: ${cacheCount} items cached`;
            statusElement.style.color = '#28a745';
        }
    }

    // Enhanced fetch with caching
    async function fetchWithCache(url) {
        // Try to get from cache first
        const cachedData = getCachedData(url);
        if (cachedData) {
            console.log(`Using cached data for: ${url}`);
            updateCacheStatus();
            return cachedData;
        }

        // Fetch from API
        try {
            console.log(`Fetching fresh data for: ${url}`);
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            const data = await response.json();
            
            // Cache the response
            setCachedData(url, data);
            updateCacheStatus();
            return data;
        } catch (error) {
            console.error('Fetch error:', error);
            // Try to return stale cache if available
            const staleCache = sessionStorage.getItem(getCacheKey(url));
            if (staleCache) {
                console.warn('API failed, returning stale cache for:', url);
                return JSON.parse(staleCache);
            }
            throw error;
        }
    }

    async function loadSeasons() {
        // Initialize cache status
        updateCacheStatus();
        
        // Show skeleton loading for seasons dropdown
        showSeasonsSkeleton();
        
        try {
            const seasons = await fetchWithCache(`${API_BASE}/seasons`);
            const select = document.getElementById('seasonSelect');
            select.innerHTML = '';
            
            if (seasons.length === 0) {
                const option = document.createElement('option');
                option.text = "No seasons available";
                select.add(option);
                return;
            }

            seasons.forEach(season => {
                const option = document.createElement('option');
                option.value = season;
                option.text = `20${season.substring(0, 2)}/20${season.substring(2, 4)}`;
                select.add(option);
            });
            
            // Restore checkbox state from localStorage
            const savedRecentState = localStorage.getItem('showRecentMatches');
            const includeRecentCheckbox = document.getElementById('includeRecent');
            if (savedRecentState !== null) {
                includeRecentCheckbox.checked = savedRecentState === 'true';
            }
            
            // Check URL parameters for season and recent matches
            const urlParams = new URLSearchParams(window.location.search);
            const seasonParam = urlParams.get('season');
            const recentParam = urlParams.get('recent');
            
            // Set season from URL or use first season
            if (seasonParam && seasons.includes(seasonParam)) {
                select.value = seasonParam;
            } else if (seasons.length > 0) {
                select.value = seasons[0];
                // Update URL to reflect the default selection
                const url = new URL(window.location);
                url.searchParams.set('season', seasons[0]);
                window.history.replaceState({}, '', url);
            }
            
            // Set recent matches from URL
            if (recentParam !== null) {
                includeRecentCheckbox.checked = recentParam === 'true';
                localStorage.setItem('showRecentMatches', recentParam);
            }
            
            // Auto-fetch if season is selected
            if (select.value) {
                fetchStandings();
            }

        } catch (error) {
            console.error('Error loading seasons:', error);
            document.getElementById('error-message').innerText = 'Failed to load seasons.';
        }
    }

    function showSkeletonLoader(includeRecent = false) {
        const numSkeletonRows = 20; // Show 20 skeleton rows
        const formColspan = includeRecent ? 11 : 10;
        
        return Array(numSkeletonRows).fill('').map(() => `
            <tr class="skeleton-row">
                <td><div class="skeleton skeleton-position"></div></td>
                <td><div class="skeleton skeleton-team"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                <td><div class="skeleton skeleton-number"></div></td>
                ${includeRecent ? '<td><div class="skeleton skeleton-form"></div></td>' : ''}
            </tr>
        `).join('');
    }

    function showSeasonsSkeleton() {
        const select = document.getElementById('seasonSelect');
        select.innerHTML = '';
        
        // Add skeleton options
        for (let i = 0; i < 5; i++) {
            const option = document.createElement('option');
            option.disabled = true;
            option.innerHTML = `<div class="skeleton skeleton-text" style="width: 80px; height: 16px;"></div>`;
            select.add(option);
        }
    }

    async function fetchStandings() {
        const season = document.getElementById('seasonSelect').value;
        const includeRecent = document.getElementById('includeRecent').checked;
        const table = document.getElementById('standingsTable');
        const tbody = table.querySelector('tbody');
        const errorDiv = document.getElementById('error-message');
        const formHeader = document.getElementById('formHeader');

        // Update URL to reflect the current selections
        const url = new URL(window.location);
        url.searchParams.set('season', season);
        if (includeRecent) {
            url.searchParams.set('recent', 'true');
        } else {
            url.searchParams.delete('recent');
        }
        window.history.replaceState({}, '', url);

        if (!season) {
            errorDiv.innerText = 'Please select a season.';
            return;
        }

        errorDiv.innerText = '';
        tbody.innerHTML = showSkeletonLoader(includeRecent);
        table.style.display = 'table';

        // Show/hide form column based on checkbox
        formHeader.style.display = includeRecent ? 'table-cell' : 'none';

        try {
            const url = includeRecent ? 
                `${API_BASE}/standings/${season}?include_recent=true` : 
                `${API_BASE}/standings/${season}`;
            
            const standings = await fetchWithCache(url);
            currentStandings = standings;

            // Clear filters when new data loads
            clearSearch();
            renderTable(currentStandings, includeRecent);

        } catch (error) {
            console.error('Error fetching standings:', error);
            const message = (error && error.message) ? error.message : String(error);
            errorDiv.innerText = `Failed to load standings. Please try again. (${message})`;
            tbody.innerHTML = '';
        }
    }

    function renderTable(data, includeRecent = false) {
        const table = document.getElementById('standingsTable');
        const tbody = table.querySelector('tbody');
        const totalTeams = data.length;

        tbody.innerHTML = '';
        
        if (data.length === 0) {
            const colspan = includeRecent ? 11 : 10;
            tbody.innerHTML = `<tr><td colspan="${colspan}">No data available for this season.</td></tr>`;
            return;
        }

        data.forEach(team => {
            const row = document.createElement('tr');
            
            // Apply colors based on position
            if (team.position <= 4) {
                row.classList.add('ucl-row');
            } else if (team.position === 5) {
                row.classList.add('uel-row');
            } else if (team.position >= 18) {
                row.classList.add('rel-row');
            }

            let formCell = '';
            if (includeRecent && team.form) {
                const recentMatches = team.recent_matches || [];
                
                // Create individual match badges with tooltips
                const formDisplay = team.form.split('').map((result, index) => {
                    const cssClass = result === 'W' ? 'form-win' : 
                                   result === 'D' ? 'form-draw' : 'form-loss';
                    
                    if (index < recentMatches.length) {
                        const match = recentMatches[index];
                        const venue = match.home ? '(H)' : '(A)';
                        const tooltipText = `${match.date} ${venue} ${match.opponent} (${match.score})`;
                        
                        return `
                            <div class="tooltip">
                                <div class="form-match ${cssClass}">${result}</div>
                                <div class="tooltiptext">${tooltipText}</div>
                            </div>
                        `;
                    } else {
                        return `<div class="form-match ${cssClass}">${result}</div>`;
                    }
                }).join('');
                
                formCell = `
                    <td class="form-cell">
                        <div class="form-display">${formDisplay}</div>
                    </td>
                `;
            }

            row.innerHTML = `
                <td>${team.position}</td>
                <td style="text-align: left; font-weight: bold;">
                    <a href="/team-detail?team=${encodeURIComponent(team.team)}" style="text-decoration: none; color: inherit; display: block;">
                        ${team.team}
                    </a>
                </td>
                <td>${team.played}</td>
                <td>${team.won}</td>
                <td>${team.drawn}</td>
                <td>${team.lost}</td>
                <td>${team.goals_for}</td>
                <td>${team.goals_against}</td>
                <td>${team.goal_difference}</td>
                <td><strong>${team.points}</strong></td>
                ${formCell}
            `;
            tbody.appendChild(row);
        });
    }

    // Search and Filter Functions
    function filterTeams() {
        if (!currentStandings || currentStandings.length === 0) return;

        const searchTerm = document.getElementById('teamSearch').value.toLowerCase();
        const positionFilter = document.getElementById('positionFilter').value;
        const formFilter = document.getElementById('formFilter').value;
        
        let filteredData = currentStandings.filter(team => {
            const matchesSearch = team.team.toLowerCase().includes(searchTerm);
            const matchesPosition = !positionFilter || checkPositionRange(team.position, positionFilter);
            const matchesForm = !formFilter || (team.form && checkFormPattern(team.form, formFilter));
            
            return matchesSearch && matchesPosition && matchesForm;
        });
        
        renderTable(filteredData, document.getElementById('includeRecent').checked);
        updateFilterResults(filteredData.length, currentStandings.length);
    }

    function checkPositionRange(position, range) {
        if (range.includes('-')) {
            const [min, max] = range.split('-').map(Number);
            return position >= min && position <= max;
        }
        return position == parseInt(range);
    }

    function checkFormPattern(form, pattern) {
        if (!form || !pattern) return false;
        
        // Check for consecutive patterns (WWW, DDD, LLL)
        if (pattern === 'WWW' || pattern === 'DDD' || pattern === 'LLL') {
            return form.includes(pattern);
        }
        
        return false;
    }

    function clearSearch() {
        document.getElementById('teamSearch').value = '';
        document.getElementById('positionFilter').value = '';
        document.getElementById('formFilter').value = '';
        
        if (currentStandings && currentStandings.length > 0) {
            renderTable(currentStandings, document.getElementById('includeRecent').checked);
            updateFilterResults(currentStandings.length, currentStandings.length, true);
        }
    }

    function updateFilterResults(filteredCount, totalCount, cleared = false) {
        const resultsDiv = document.getElementById('filterResults');
        
        if (cleared) {
            resultsDiv.style.display = 'none';
            return;
        }
        
        if (filteredCount === 0) {
            resultsDiv.innerHTML = 'No teams match your search criteria.';
            resultsDiv.className = 'filter-results no-results';
        } else if (filteredCount < totalCount) {
            resultsDiv.innerHTML = `Showing ${filteredCount} of ${totalCount} teams`;
            resultsDiv.className = 'filter-results';
        } else {
            resultsDiv.style.display = 'none';
            return;
        }
        
        resultsDiv.style.display = 'block';
    }

    function sortTable(column) {
        if (!currentStandings || currentStandings.length === 0) return;

        // Toggle sort direction
        if (!sortDirection[column]) {
            sortDirection[column] = 'asc';
        } else {
            sortDirection[column] = sortDirection[column] === 'asc' ? 'desc' : 'asc';
        }

        const direction = sortDirection[column];

        // Update sort icons
        document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '');
        const iconId = `sort-${column}`;
        const iconElement = document.getElementById(iconId);
        if (iconElement) {
            iconElement.innerText = direction === 'asc' ? '▲' : '▼';
        }

        currentStandings.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            // Handle string comparison for team names
            if (typeof valA === 'string') {
                valA = valA.toLowerCase();
                valB = valB.toLowerCase();
            }

            if (valA < valB) {
                return direction === 'asc' ? -1 : 1;
            }
            if (valA > valB) {
                return direction === 'asc' ? 1 : -1;
            }
            return 0;
        });

        const includeRecent = document.getElementById('includeRecent').checked;
        renderTable(currentStandings, includeRecent);
    }

    // Load seasons on page load
    window.onload = function() {
        loadSeasons();
    };
</script>

</body>
</html>
