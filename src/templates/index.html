<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPL Standings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .legend {
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #666;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            margin: 0 10px;
        }
        .color-box {
            width: 15px;
            height: 15px;
            margin-right: 5px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #343a40;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background-color: #495057;
        }
        .sort-icon {
            margin-left: 5px;
            font-size: 0.8em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #f1f1f1; /* Fallback */
        }
        
        /* Row Colors */
        .ucl-row {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .ucl-row:hover {
            background-color: #c1d6cc;
        }
        
        .uel-row {
            background-color: #fff3cd;
            color: #664d03;
        }
        .uel-row:hover {
            background-color: #ffe69c;
        }
        
        .rel-row {
            background-color: #f8d7da;
            color: #842029;
        }
        .rel-row:hover {
            background-color: #f1aeb5;
        }

        .error {
            color: #dc3545;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            text-decoration: none;
            color: #555;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            margin: 0 10px;
        }
        .tab:hover {
            color: #007bff;
        }
        .tab.active {
            color: #007bff;
            border-bottom: 3px solid #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <a href="/" class="tab active">Standings</a>
        <a href="/team-history" class="tab">Team History</a>
    </div>
    <h1>EPL Season Standings</h1>
    
    <div class="controls">
        <label for="seasonSelect">Select Season:</label>
        <select id="seasonSelect">
            <option value="" disabled selected>Loading seasons...</option>
        </select>
        <button onclick="fetchStandings()">Get Standings</button>
    </div>

    <div class="legend">
        <span class="legend-item"><span class="color-box" style="background-color: #d1e7dd;"></span> Champions League (1-4)</span>
        <span class="legend-item"><span class="color-box" style="background-color: #fff3cd;"></span> Europa League (5)</span>
        <span class="legend-item"><span class="color-box" style="background-color: #f8d7da;"></span> Relegation (Bottom 3)</span>
    </div>

    <div id="error-message" class="error"></div>

    <table id="standingsTable" style="display: none;">
        <thead>
            <tr>
                <th onclick="sortTable('position')">Pos <span id="sort-position" class="sort-icon"></span></th>
                <th onclick="sortTable('team')">Team <span id="sort-team" class="sort-icon"></span></th>
                <th onclick="sortTable('played')">Played <span id="sort-played" class="sort-icon"></span></th>
                <th onclick="sortTable('won')">Won <span id="sort-won" class="sort-icon"></span></th>
                <th onclick="sortTable('drawn')">Drawn <span id="sort-drawn" class="sort-icon"></span></th>
                <th onclick="sortTable('lost')">Lost <span id="sort-lost" class="sort-icon"></span></th>
                <th onclick="sortTable('goals_for')">GF <span id="sort-goals_for" class="sort-icon"></span></th>
                <th onclick="sortTable('goals_against')">GA <span id="sort-goals_against" class="sort-icon"></span></th>
                <th onclick="sortTable('goal_difference')">GD <span id="sort-goal_difference" class="sort-icon"></span></th>
                <th onclick="sortTable('points')">Points <span id="sort-points" class="sort-icon"></span></th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be inserted here -->
        </tbody>
    </table>
</div>

<script>
    const API_BASE = '/api';
    let currentStandings = [];
    let sortDirection = {};

    async function loadSeasons() {
        try {
            const response = await fetch(`${API_BASE}/seasons`);
            const seasons = await response.json();
            const select = document.getElementById('seasonSelect');
            select.innerHTML = '';
            
            if (seasons.length === 0) {
                const option = document.createElement('option');
                option.text = "No seasons available";
                select.add(option);
                return;
            }

            seasons.forEach(season => {
                const option = document.createElement('option');
                option.value = season;
                option.text = `20${season.substring(0, 2)}/20${season.substring(2, 4)}`;
                select.add(option);
            });
            
            // Select the first season by default and fetch standings
            if (seasons.length > 0) {
                select.value = seasons[0];
                fetchStandings();
            }

        } catch (error) {
            console.error('Error loading seasons:', error);
            document.getElementById('error-message').innerText = 'Failed to load seasons.';
        }
    }

    async function fetchStandings() {
        const season = document.getElementById('seasonSelect').value;
        const table = document.getElementById('standingsTable');
        const tbody = table.querySelector('tbody');
        const errorDiv = document.getElementById('error-message');

        if (!season) {
            errorDiv.innerText = 'Please select a season.';
            return;
        }

        errorDiv.innerText = '';
        tbody.innerHTML = '<tr><td colspan="10">Loading...</td></tr>';
        table.style.display = 'table';

        try {
            const response = await fetch(`${API_BASE}/standings/${season}`);
            if (!response.ok) {
                throw new Error('Failed to fetch standings');
            }
            const standings = await response.json();
            currentStandings = standings;

            renderTable(currentStandings);

        } catch (error) {
            console.error('Error fetching standings:', error);
            errorDiv.innerText = 'Failed to fetch standings. Please try again.';
            tbody.innerHTML = '';
        }
    }

    function renderTable(data) {
        const table = document.getElementById('standingsTable');
        const tbody = table.querySelector('tbody');
        const totalTeams = data.length;

        tbody.innerHTML = '';
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10">No data available for this season.</td></tr>';
            return;
        }

        data.forEach(team => {
            const row = document.createElement('tr');
            
            // Apply colors based on position
            if (team.position <= 4) {
                row.classList.add('ucl-row');
            } else if (team.position === 5) {
                row.classList.add('uel-row');
            } else if (team.position > totalTeams - 3) {
                row.classList.add('rel-row');
            }

            row.innerHTML = `
                <td>${team.position}</td>
                <td style="text-align: left; font-weight: bold;">
                    <a href="/team-detail?team=${encodeURIComponent(team.team)}" style="text-decoration: none; color: inherit; display: block;">
                        ${team.team}
                    </a>
                </td>
                <td>${team.played}</td>
                <td>${team.won}</td>
                <td>${team.drawn}</td>
                <td>${team.lost}</td>
                <td>${team.goals_for}</td>
                <td>${team.goals_against}</td>
                <td>${team.goal_difference}</td>
                <td><strong>${team.points}</strong></td>
            `;
            tbody.appendChild(row);
        });
    }

    function sortTable(column) {
        if (!currentStandings || currentStandings.length === 0) return;

        // Toggle sort direction
        if (!sortDirection[column]) {
            sortDirection[column] = 'asc';
        } else {
            sortDirection[column] = sortDirection[column] === 'asc' ? 'desc' : 'asc';
        }

        const direction = sortDirection[column];

        // Update sort icons
        document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '');
        const iconId = `sort-${column}`;
        const iconElement = document.getElementById(iconId);
        if (iconElement) {
            iconElement.innerText = direction === 'asc' ? '▲' : '▼';
        }

        currentStandings.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            // Handle string comparison for team names
            if (typeof valA === 'string') {
                valA = valA.toLowerCase();
                valB = valB.toLowerCase();
            }

            if (valA < valB) {
                return direction === 'asc' ? -1 : 1;
            }
            if (valA > valB) {
                return direction === 'asc' ? 1 : -1;
            }
            return 0;
        });

        renderTable(currentStandings);
    }

    // Load seasons on page load
    window.onload = loadSeasons;
</script>

</body>
</html>
