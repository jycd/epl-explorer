<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Details</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/match-details.css">
</head>
</head>
<body>

<div class="container">
    <div class="tabs">
        <a href="/" class="tab">Standings</a>
        <a href="/team-history" class="tab">Team History</a>
        <a href="/average-stats" class="tab">Average Stats</a>
    </div>
    <h1 id="pageTitle">Match Details</h1>
    
    <div id="loading" class="loading">Loading...</div>
    <div id="error-message" class="error"></div>

    <table id="matchesTable" style="display: none;">
        <thead>
            <tr>
                <th>Season</th>
                <th>Date</th>
                <th>Home Team</th>
                <th>Score</th>
                <th>Away Team</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody id="matchesBody">
        </tbody>
    </table>
</div>

<script>
    async function loadMatchDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const team = urlParams.get('team');
        const opponent = urlParams.get('opponent');

        // Set up navigation back to team detail if team is provided
        if (team) {
            // Create a back button dynamically
            const backButton = document.createElement('div');
            backButton.className = 'nav';
            backButton.innerHTML = `<a href="/team-detail?team=${encodeURIComponent(team)}">← Back to Team Detail</a>`;
            document.querySelector('.container').insertBefore(backButton, document.querySelector('.tabs'));
        }

        if (!team || !opponent) {
            document.getElementById('error-message').innerText = 'Missing team or opponent information.';
            document.getElementById('loading').style.display = 'none';
            return;
        }

        document.getElementById('pageTitle').innerText = `Matches: ${team} vs ${opponent}`;

        try {
            const response = await fetch(`/api/match-details/${encodeURIComponent(team)}/${encodeURIComponent(opponent)}`);
            if (!response.ok) {
                throw new Error('Failed to fetch match details');
            }
            const matches = await response.json();
            
            const tbody = document.getElementById('matchesBody');
            tbody.innerHTML = '';

            if (matches.length === 0) {
                document.getElementById('error-message').innerText = 'No matches found.';
            } else {
                matches.forEach(match => {
                    const row = document.createElement('tr');
                    
                    let resultText = '';
                    let resultClass = '';
                    
                    if (match.home_team === team) {
                        if (match.ftr === 'H') { resultText = 'Win'; resultClass = 'win'; }
                        else if (match.ftr === 'D') { resultText = 'Draw'; resultClass = 'draw'; }
                        else { resultText = 'Loss'; resultClass = 'loss'; }
                    } else {
                        if (match.ftr === 'A') { resultText = 'Win'; resultClass = 'win'; }
                        else if (match.ftr === 'D') { resultText = 'Draw'; resultClass = 'draw'; }
                        else { resultText = 'Loss'; resultClass = 'loss'; }
                    }

                    row.innerHTML = `
                        <td>${match.season}</td>
                        <td>${match.date}</td>
                        <td>${match.home_team}</td>
                        <td>${match.fthg} - ${match.ftag}</td>
                        <td>${match.away_team}</td>
                        <td><span class="match-result ${resultClass}">${resultText}</span></td>
                    `;
                    tbody.appendChild(row);
                });
                document.getElementById('matchesTable').style.display = 'table';
            }

        } catch (error) {
            console.error('Error:', error);
            document.getElementById('error-message').innerText = 'Error loading match details.';
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    window.onload = loadMatchDetails;
</script>

</body>
</html>
