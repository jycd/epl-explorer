<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Detail</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/team-detail.css">
</head>
<body>

    <div class="container">
        <div class="tabs">
            <a href="/" class="tab">Standings</a>
            <a href="/team-history" class="tab">Team History</a>
            <a href="/average-stats" class="tab">Average Stats</a>
        </div>
        <h1 id="pageTitle">Team Detail</h1>
        
        <div id="error-message" class="error"></div>

        <div class="chart-container">
            <div class="chart-loading" id="opponentLoading" style="display: none;">
                <div class="skeleton"></div>
            </div>
            <canvas id="opponentWinRateChart"></canvas>
        </div>
        
        <h2>Win Rate by Month</h2>
        
        <div class="controls">
            <label for="seasonSelect">Select Season:</label>
            <select id="seasonSelect" onchange="updateMonthlyChart()">
                <option value="">All Seasons (Last 10)</option>
            </select>
        </div>

        <div class="chart-container">
            <div class="chart-loading" id="monthlyLoading" style="display: none;">
                <div class="skeleton"></div>
            </div>
            <canvas id="monthlyWinRateChart"></canvas>
        </div>
    </div>

<script>
    let opponentWinRateChartInstance = null;
    let monthlyWinRateChartInstance = null;
    let currentTeam = null;

    async function fetchData() {
        const urlParams = new URLSearchParams(window.location.search);
        const team = urlParams.get('team');
        currentTeam = team;
        const errorDiv = document.getElementById('error-message');
        
        if (!team) {
            errorDiv.innerText = 'No team specified.';
            return;
        }

        document.getElementById('pageTitle').innerText = `${team} - Team Details`;
        errorDiv.innerText = '';

        try {
            // Fetch Seasons
            const seasonsResponse = await fetch('/api/seasons');
            const seasons = await seasonsResponse.json();
            const seasonSelect = document.getElementById('seasonSelect');
            seasons.forEach(season => {
                const option = document.createElement('option');
                option.value = season;
                option.text = season;
                seasonSelect.appendChild(option);
            });

            // Fetch Opponent Win Rates
            const opponentResponse = await fetch(`/api/team-win-rate-against-others/${encodeURIComponent(team)}`);
            const monthlyResponse = await fetch(`/api/team-win-rate-by-month/${encodeURIComponent(team)}`);

            if (!opponentResponse.ok || !monthlyResponse.ok) {
                throw new Error('Failed to fetch data');
            }
            
            const opponentData = await opponentResponse.json();
            const monthlyData = await monthlyResponse.json();

            if (opponentData.length === 0 && monthlyData.length === 0) {
                errorDiv.innerText = 'No data found for this team.';
                if (opponentWinRateChartInstance) opponentWinRateChartInstance.destroy();
                if (monthlyWinRateChartInstance) monthlyWinRateChartInstance.destroy();
                return;
            }

            if (opponentData.length > 0) {
                renderOpponentWinRateChart(team, opponentData);
            }
            
            if (monthlyData.length > 0) {
                renderMonthlyWinRateChart(team, monthlyData);
            }

        } catch (error) {
            console.error('Error:', error);
            errorDiv.innerText = 'Error fetching data. Please try again.';
        }
    }

    async function updateMonthlyChart() {
        const season = document.getElementById('seasonSelect').value;
        const errorDiv = document.getElementById('error-message');
        
        try {
            let url = `/api/team-win-rate-by-month/${encodeURIComponent(currentTeam)}`;
            if (season) {
                url += `?season=${season}`;
            }
            
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch monthly data');
            
            const data = await response.json();
            renderMonthlyWinRateChart(currentTeam, data);
            
        } catch (error) {
            console.error('Error:', error);
            errorDiv.innerText = 'Error updating chart.';
        }
    }

    function renderMonthlyWinRateChart(team, data) {
        const ctx = document.getElementById('monthlyWinRateChart').getContext('2d');
        
        if (monthlyWinRateChartInstance) {
            monthlyWinRateChartInstance.destroy();
        }

        const labels = data.map(d => d.month);
        const winRates = data.map(d => d.win_rate);
        const matches = data.map(d => d.matches);

        // Generate colors
        const backgroundColors = labels.map((_, index) => {
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            const hue = (index * 360 / labels.length) % 360;
            gradient.addColorStop(0, `hsla(${hue}, 70%, 60%, 0.8)`);
            gradient.addColorStop(1, `hsla(${hue}, 70%, 40%, 0.8)`);
            return gradient;
        });

        monthlyWinRateChartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Win Rate (%)',
                    data: winRates,
                    backgroundColor: backgroundColors,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            usePointStyle: true,
                            font: {
                                size: 12
                            }
                        }
                    },
                    title: {
                        display: true,
                        text: `Win Rate by Month`,
                        font: {
                            size: 16
                        },
                        align: 'center',
                        padding: {
                            bottom: 20
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        borderColor: 'var(--chart-purple)',
                        borderWidth: 1,
                        cornerRadius: 8,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                const index = context.dataIndex;
                                const value = context.raw;
                                const m = matches[index];
                                return `${context.label}: ${value}% (Matches: ${m})`;
                            }
                        }
                    }
                }
            }
        });
    }

    function renderOpponentWinRateChart(team, data) {
        const ctx = document.getElementById('opponentWinRateChart').getContext('2d');
        
        if (opponentWinRateChartInstance) {
            opponentWinRateChartInstance.destroy();
        }

        // Take top 20 opponents for readability
        const topData = data.slice(0, 20);
        const labels = topData.map(d => d.opponent);
        const winRates = topData.map(d => d.win_rate);
        const matches = topData.map(d => d.matches);

        opponentWinRateChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Win Rate (%)',
                    data: winRates,
                    backgroundColor: '#667eea',
                    borderColor: '#667eea',
                    borderWidth: 2,
                    hoverBackgroundColor: '#667eea',
                    hoverBorderColor: '#667eea',
                    hoverBorderWidth: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        borderColor: 'var(--chart-purple)',
                        borderWidth: 1,
                        cornerRadius: 8,
                        padding: 12
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            font: {
                                size: 12,
                                weight: '500'
                            },
                            color: 'var(--text-muted)'
                        },
                        title: {
                            display: true,
                            text: 'Win Rate (%)',
                            font: {
                                size: 14,
                                weight: '600'
                            },
                            color: 'var(--text-primary)'
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    x: {
                        ticks: {
                            font: {
                                size: 12,
                                weight: '500'
                            },
                            color: 'var(--text-muted)'
                        },
                        title: {
                            display: true,
                            text: 'Opponent',
                            font: {
                                size: 14,
                                weight: '600'
                            },
                            color: 'var(--text-primary)'
                        },
                        grid: {
                            display: false
                        }
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: `Win Rate Against Opponents (Last 10 Seasons) - ${team}`,
                        font: {
                            size: 16,
                            weight: '600'
                        },
                        color: 'var(--text-primary)',
                        padding: {
                            bottom: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            afterLabel: function(context) {
                                const index = context.dataIndex;
                                const m = matches[index];
                                const wr = winRates[index];
                                return `Win Rate: ${wr}% (Matches: ${m})`;
                            }
                        }
                    }
                },
                onClick: (e) => {
                    const points = opponentWinRateChartInstance.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
                    if (points.length) {
                        const firstPoint = points[0];
                        const label = opponentWinRateChartInstance.data.labels[firstPoint.index];
                        // Navigate to match details page
                        window.location.href = `/match-details?team=${encodeURIComponent(team)}&opponent=${encodeURIComponent(label)}`;
                    }
                }
            }
        });
    }
    
    // Load data on page load
    window.onload = fetchData;
</script>

</body>
</html>
