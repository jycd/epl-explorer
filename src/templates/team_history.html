<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/team-history.css">
</head>
<body>

<div class="container">
    <div class="tabs">
        <a href="/" class="tab">Standings</a>
        <a href="/team-history" class="tab active">Team History</a>
        <a href="/average-stats" class="tab">Average Stats</a>
    </div>
    <h1>Team History</h1>
    
    <div class="controls">
        <select id="teamSelect">
            <option value="" disabled selected>Loading teams...</option>
        </select>
        <button onclick="fetchData()" id="fetchButton">Show Chart</button>
    </div>

    <div id="error-message" class="error"></div>

    <div class="chart-container">
        <div class="chart-loading" id="standingLoading" style="display: none;">
            <div class="skeleton"></div>
        </div>
        <canvas id="standingChart"></canvas>
    </div>
    <div class="chart-container">
        <div class="chart-loading" id="winRateLoading" style="display: none;">
            <div class="skeleton"></div>
        </div>
        <canvas id="winRateChart"></canvas>
    </div>
    <div class="chart-container">
        <div class="chart-loading" id="gdLoading" style="display: none;">
            <div class="skeleton"></div>
        </div>
        <canvas id="gdChart"></canvas>
    </div>
</div>

<script src="/static/js/team-history.js"></script>

</body>
</html>
